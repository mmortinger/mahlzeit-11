name: Menüs crawlen & Seite deployen

on:
  schedule:
    # Mo–Fr, UTC. Wien = UTC+1 (Winter) bzw. UTC+2 (Sommer):
    #   06:30 UTC -> 07:30 / 08:30   (Wochenmenüs)
    #   08:30 UTC -> 09:30 / 10:30   (Tagesmenüs ab ca. 9:30)
    #   10:15 UTC -> 11:15 / 12:15   (Nachzügler, z. B. Osfizio stellt teils erst ~10:45 online)
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Testalarm auslösen (prüft, ob die Fehler-Mail ankommt)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/menu.json"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    # Bei reinen Frontend-Änderungen (push) nicht crawlen, nur deployen
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      problems: ${{ steps.scrape.outputs.problems }}
      problem_text: ${{ steps.scrape.outputs.problem_text }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scraper/requirements.txt

      - name: Tests (Fixtures)
        id: tests
        # Ein roter Test soll den Crawl nicht verhindern – der Job 'health' meldet ihn danach.
        continue-on-error: true
        run: python -m pytest scraper/tests -q

      - name: Scraper laufen lassen
        id: scrape
        run: python -m scraper

      - name: menu.json committen (nur bei Änderungen)
        run: |
          if git diff --quiet -- site/data/menu.json; then
            echo "Keine Änderungen an menu.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/menu.json
          git commit -m "Menüs aktualisiert ($(TZ=Europe/Vienna date '+%a %d.%m. %H:%M'))"
          git pull --rebase --autostash
          git push

  deploy:
    needs: scrape
    # läuft auch, wenn scrape übersprungen wurde (push), aber nicht, wenn es fehlschlug
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # neuester Stand inkl. frischem menu.json-Commit

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  # Läuft nach Crawl + Deploy und lässt den Workflow fehlschlagen, wenn etwas nicht stimmt.
  # GitHub schickt bei fehlgeschlagenen Läufen automatisch eine Mail (Settings -> Notifications -> Actions).
  # Die Daten sind zu diesem Zeitpunkt schon gespeichert und veröffentlicht.
  health:
    needs: [scrape, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis prüfen
        env:
          SCRAPE_RESULT: ${{ needs.scrape.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TESTS: ${{ needs.scrape.outputs.tests }}
          PROBLEMS: ${{ needs.scrape.outputs.problems }}
          PROBLEM_TEXT: ${{ needs.scrape.outputs.problem_text }}
          TEST_ALARM: ${{ inputs.test_alarm }}
        run: |
          fail=0
          if [ "$TEST_ALARM" = "true" ]; then
            echo "::error title=Testalarm::Testalarm – wenn diese Mail ankommt, funktioniert die Benachrichtigung."
            fail=1
          fi
          if [ "$SCRAPE_RESULT" != "success" ]; then
            echo "::error title=Crawl fehlgeschlagen::Der Crawl-Job ist fehlgeschlagen ($SCRAPE_RESULT) – kein Restaurant konnte geladen werden oder die Installation brach ab."
            fail=1
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error title=Deploy fehlgeschlagen::Die Seite konnte nicht veröffentlicht werden ($DEPLOY_RESULT)."
            fail=1
          fi
          if [ "$TESTS" = "failure" ]; then
            echo "::error title=Tests rot::Mindestens ein Parser-Test schlägt fehl."
            fail=1
          fi
          if [ "${PROBLEMS:-0}" != "0" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Menü-Problem::$line"
            done <<< "$PROBLEM_TEXT"
            fail=1
          fi
          if [ "$fail" = "0" ]; then echo "Alles ok – alle Restaurants aktuell."; fi
          exit "$fail"
