name: Menüs crawlen & Seite deployen

on:
  schedule:
    # UTC. Wien = UTC+1 (Winter) bzw. UTC+2 (Sommer).
    # GitHub startet geplante Läufe oft stark verspätet (beobachtet: mehrere Stunden),
    # daher zusätzlich Abend- und Nachtläufe – Wochenmenüs (Lercherl, Interspar, Fruga)
    # stehen meist schon Tage vorher online, Osfizio manchmal am Vorabend.
    #   18:30 UTC So–Do -> 19:30 / 20:30   (Menüs für den nächsten Tag)
    #   01:30 UTC Mo–Fr -> 02:30 / 03:30
    #   04:30 UTC Mo–Fr -> 05:30 / 06:30
    #   06:30 UTC Mo–Fr -> 07:30 / 08:30
    #   08:30 UTC Mo–Fr -> 09:30 / 10:30   (Tagesmenüs ab ca. 9:30)
    #   10:15 UTC Mo–Fr -> 11:15 / 12:15   (Nachzügler, z. B. Osfizio stellt teils erst ~10:45 online)
    - cron: "30 18 * * 0-4"
    - cron: "30 1 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Testalarm auslösen (prüft, ob die Fehler-Mail ankommt)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/menu.json"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    # Bei reinen Frontend-Änderungen (push) nicht crawlen, nur deployen
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      problems: ${{ steps.scrape.outputs.problems }}
      problem_text: ${{ steps.scrape.outputs.problem_text }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r scraper/requirements.txt

      - name: Tests (Fixtures)
        id: tests
        # Ein roter Test soll den Crawl nicht verhindern – der Job 'health' meldet ihn danach.
        continue-on-error: true
        run: python -m pytest scraper/tests -q

      - name: Scraper laufen lassen
        id: scrape
        run: python -m scraper

      - name: Diagnose-Dateien hochladen (nur wenn ein Scraper scheiterte)
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: diagnose-${{ github.run_id }}
          path: debug/
          retention-days: 14

      - name: menu.json committen (nur bei Änderungen)
        run: |
          if git diff --quiet -- site/data/menu.json; then
            echo "Keine Änderungen an menu.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/menu.json
          git commit -m "Menüs aktualisiert ($(TZ=Europe/Vienna date '+%a %d.%m. %H:%M'))"
          git pull --rebase --autostash
          git push

  deploy:
    needs: scrape
    # läuft auch, wenn scrape übersprungen wurde (push), aber nicht, wenn es fehlschlug
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}  # neuester Stand inkl. frischem menu.json-Commit

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHubs Artefakt-Liste hinkt manchmal hinterher ("Found 0 artifact(s)" direkt nach dem
      # Upload) – kurz warten und bei Fehlschlag nach 30 s ein zweites Mal versuchen.
      - name: Kurz warten
        run: sleep 5

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Warten vor zweitem Deploy-Versuch
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # Läuft nach Crawl + Deploy und lässt den Workflow fehlschlagen, wenn etwas nicht stimmt.
  # GitHub schickt bei fehlgeschlagenen Läufen automatisch eine Mail (Settings -> Notifications -> Actions).
  # Die Daten sind zu diesem Zeitpunkt schon gespeichert und veröffentlicht.
  health:
    needs: [scrape, deploy]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis prüfen
        env:
          SCRAPE_RESULT: ${{ needs.scrape.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TESTS: ${{ needs.scrape.outputs.tests }}
          PROBLEMS: ${{ needs.scrape.outputs.problems }}
          PROBLEM_TEXT: ${{ needs.scrape.outputs.problem_text }}
          TEST_ALARM: ${{ inputs.test_alarm }}
        run: |
          fail=0
          if [ "$TEST_ALARM" = "true" ]; then
            echo "::error title=Testalarm::Testalarm – wenn diese Mail ankommt, funktioniert die Benachrichtigung."
            fail=1
          fi
          if [ "$SCRAPE_RESULT" != "success" ]; then
            echo "::error title=Crawl fehlgeschlagen::Der Crawl-Job ist fehlgeschlagen ($SCRAPE_RESULT) – kein Restaurant konnte geladen werden oder die Installation brach ab."
            fail=1
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            echo "::error title=Deploy fehlgeschlagen::Die Seite konnte nicht veröffentlicht werden ($DEPLOY_RESULT)."
            fail=1
          fi
          if [ "$TESTS" = "failure" ]; then
            echo "::error title=Tests rot::Mindestens ein Parser-Test schlägt fehl."
            fail=1
          fi
          if [ "${PROBLEMS:-0}" != "0" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Menü-Problem::$line"
            done <<< "$PROBLEM_TEXT"
            fail=1
          fi
          if [ "$fail" = "0" ]; then echo "Alles ok – alle Restaurants aktuell."; fi
          exit "$fail"
